<mat-card class="header-card">
  <mat-toolbar class="header-toolbar">
    <div class="header-brand">
      <img src="img/attus-logo.png" alt="Logo Attus" routerLink="" class="brand-logo" />

      <div class="brand-text">
        <span class="title">Procuradoria Digital</span>
        <span class="subtitle">Gestão de Pedidos</span>
      </div>
    </div>

    <nav class="header-nav">
      @if (isTrue$ | async) {
        <button mat-button type="button" routerLink="pedidos">Pedidos</button>
        <button mat-button type="button" (click)="logout()">Sair</button>
      } @else {
        <a mat-button routerLink="/login" class="nav-link btn-signin"> Sign in </a>

        <a mat-flat-button routerLink="/cadastro" class="btn-signup"> Sign up </a>
      }
    </nav>
  </mat-toolbar>
</mat-card>
